name: Deploy Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted: this is the org's only PUBLIC repository, and the self-hosted runner
    # group has allows_public_repositories=false, so a self-hosted job here is never picked
    # up — it sits queued forever (two Deploy runs had been waiting since morning). Hosted
    # minutes are free on a public repo. (icombilisim/ICoSys-INFRA#578)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # GitHub-hosted: this is the org's only PUBLIC repository, and the self-hosted runner
    # group has allows_public_repositories=false, so a self-hosted job here is never picked
    # up — it sits queued forever (two Deploy runs had been waiting since morning). Hosted
    # minutes are free on a public repo. (icombilisim/ICoSys-INFRA#578)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
